# Add this block INSIDE the existing "server { ... }" block that serves pm.keenable.io (the OpenProject site),
# above its "location / { ... }" block. No new DNS name or certificate is needed.
#
# The trailing slash on proxy_pass removes "/attendance" before the request reaches the service;
# X-Forwarded-Prefix tells the service to put it back in every link it generates.

location = /attendance { return 301 /attendance/; }

location /attendance/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /attendance;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
